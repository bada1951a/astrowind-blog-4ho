site:
  name: '🚀 Daily Prompt Hack'
  site: 'https://prompt.storydailyview.com'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: false

# Metadata
metadata:
  title:
    default: 'Daily Prompt Hack'
    template: '%s — Daily Prompt Hack'
  description: 'Practical AI Prompt Engineering Guides, LLM Automation Workflows, and Productivity Hacks.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: 'Daily Prompt Hack'
    type: website

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6
    post:
      isEnabled: true
      permalink: '/%slug%'
      robots:
        index: true
    list:
      isEnabled: true
      pathname: 'blog'
      robots:
        index: true
    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true
    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: true

ui:
  theme: 'system'
announcement:
  enabled: false

analytics:
  vendors:
    googleAnalytics:
      id: 'G-679M6Z66JP'
